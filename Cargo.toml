[package]
name = "mmo-auth"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots", "macros", "uuid", "migrate", "sqlx-toml"] }
url = "2.5.8"
getrandom = { version = "0.4", features = ["std"] }
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["form", "rustls"] }
jwt-simple = "0.15"
prost = "0.14.4"
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
zeroize = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
